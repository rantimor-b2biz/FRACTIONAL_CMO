<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #030509;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }
</style>
</head>
<body>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>

  <!-- Stage floor gradient -->
  <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#111318"/>
    <stop offset="100%" stop-color="#07080B"/>
  </linearGradient>

  <!-- Sky -->
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#03050A"/>
    <stop offset="100%" stop-color="#060B14"/>
  </linearGradient>

  <!-- Spotlight cone left -->
  <linearGradient id="spot1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFBE6" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#FFD580" stop-opacity="0"/>
  </linearGradient>

  <!-- Spotlight cone right -->
  <linearGradient id="spot2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFBE6" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#FFD580" stop-opacity="0"/>
  </linearGradient>

  <!-- Facade warm glow (on face) -->
  <linearGradient id="facadeGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0F1C30"/>
    <stop offset="100%" stop-color="#162540"/>
  </linearGradient>

  <!-- Window glow gradient -->
  <radialGradient id="winGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFD580" stop-opacity="0.95"/>
    <stop offset="60%" stop-color="#FF9F3A" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#FF6B1A" stop-opacity="0"/>
  </radialGradient>

  <!-- Side panel gradient (very thin — reveals it's hollow) -->
  <linearGradient id="sideGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0A1020"/>
    <stop offset="100%" stop-color="#030407"/>
  </linearGradient>

  <!-- Ground glow under facade -->
  <radialGradient id="groundGlow" cx="50%" cy="0%" r="80%">
    <stop offset="0%" stop-color="#C87020" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#C87020" stop-opacity="0"/>
  </radialGradient>

  <!-- Atmospheric haze -->
  <radialGradient id="haze" cx="42%" cy="100%" r="55%">
    <stop offset="0%" stop-color="#D4860A" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#D4860A" stop-opacity="0"/>
  </radialGradient>

  <!-- Behind-facade empty space gradient -->
  <linearGradient id="emptyBg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#07090D"/>
    <stop offset="100%" stop-color="#030406"/>
  </linearGradient>

  <!-- Glow filter for windows -->
  <filter id="winFilter" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Glow filter for facade edge -->
  <filter id="edgeGlow" x="-20%" y="-5%" width="140%" height="110%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Text glow filter -->
  <filter id="txtGlow">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Soft text glow -->
  <filter id="softTxt">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Scaffold strut pattern -->
  <pattern id="scaffoldPat" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="40" x2="40" y2="0" stroke="#1A2030" stroke-width="1" stroke-opacity="0.6"/>
  </pattern>

</defs>

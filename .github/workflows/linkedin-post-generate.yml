name: Generate Article + LinkedIn Post (auto + review issue)

on:
  schedule:
    # GitHub cron is unreliable (runs can be delayed or dropped), so we schedule
    # several attempts per posting day. A guard step ensures only the first
    # successful run of the day generates content.
    # Posting days: Sunday / Thursday (2 per week, per Ran 2026-07-02)
    # ~08:30 Israel time: 05:30 / 06:30 / 07:30 UTC
    - cron: "30 5 * * 0,4"
    - cron: "30 6 * * 0,4"
    - cron: "30 7 * * 0,4"
  workflow_dispatch:
    inputs:
      topic:
        description: "Manual topic override (optional — otherwise trending topic is auto-selected)"
        required: false

# Never run two generations in parallel (they race on the git push)
concurrency:
  group: linkedin-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout FRACTIONAL_CMO
        uses: actions/checkout@v4

      - name: Skip if today already done (scheduled runs only)
        id: guard
        run: |
          DATE=$(date +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "\"date\": \"$DATE\"" B-brain/topic-history.json 2>/dev/null; then
            echo "Content for $DATE already exists — a previous run handled today. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout website repo (ran-timor-brand)
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: rantimor-b2biz/ran-timor-brand
          token: ${{ secrets.SITE_PUSH_TOKEN }}
          path: site-repo

      - name: Set up Python
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: pip install anthropic replicate

      - name: Generate article + post (research -> article -> gatekeeper -> hero image)
        if: steps.guard.outputs.skip == 'false'
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python3 T-tools/scripts/generate_article_and_post.py --site-repo site-repo --topic "${{ github.event.inputs.topic }}"
          else
            python3 T-tools/scripts/generate_article_and_post.py --site-repo site-repo
          fi

      - name: Publish article to website repo
        if: steps.guard.outputs.skip == 'false'
        working-directory: site-repo
        run: |
          git config user.name "Fractional CMO Bot"
          git config user.email "rantimor@gmail.com"
          git add src/pages/Articles.tsx src/pages/ArticleDetail.tsx src/assets/articles/
          git diff --staged --quiet || git commit -m "New article: ${{ steps.generate.outputs.topic }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then break; fi
            echo "Push attempt $attempt failed, retrying..."
            sleep 10
          done

      - name: Commit output to FRACTIONAL_CMO
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "Fractional CMO Bot"
          git config user.email "rantimor@gmail.com"
          git add O-output/ B-brain/topic-history.json
          git diff --staged --quiet || git commit -m "Article + LinkedIn post $(date +%Y-%m-%d) — ${{ steps.generate.outputs.topic }} (awaiting publish)"
          # Ran's machine auto-syncs this repo every ~10 min, so pushes can race.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then break; fi
            echo "Push attempt $attempt failed, retrying..."
            sleep 10
          done

      - name: Open review issue (email notification to Ran)
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BODY_FILE="${{ steps.generate.outputs.outdir }}/linkedin-post.md"
          {
            cat "$BODY_FILE"
            echo ""
            echo "---"
            echo "## Publish checklist"
            echo "- [ ] **Lovable:** open the ran-timor-brand project and click **Publish → Update** so the article goes live at ${{ steps.generate.outputs.article_url }}"
            echo "- [ ] **Verify** the article renders correctly (hero image, sections, CTA)"
            echo "- [ ] **LinkedIn:** copy the post above, publish, then add the first comment with the article link"
            echo "- [ ] Close this issue"
            echo ""
            echo "**Gatekeeper verdict:** ${{ steps.generate.outputs.verdict }}"
          } > /tmp/issue-body.md
          gh label create linkedin-post --color 0A66C2 --description "Automated LinkedIn post awaiting publish" 2>/dev/null || true
          gh issue create \
            --title "Article + LinkedIn post ready — ${DATE}: ${{ steps.generate.outputs.topic }}" \
            --body-file /tmp/issue-body.md \
            --label "linkedin-post" \
            --assignee "rantimor-b2biz"

      - name: Show post in run summary
        if: steps.guard.outputs.skip == 'false'
        run: |
          cat "${{ steps.generate.outputs.outdir }}/linkedin-post.md" >> "$GITHUB_STEP_SUMMARY"
